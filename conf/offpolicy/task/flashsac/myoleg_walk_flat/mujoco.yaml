# @package _global_
training:
  task_name: MyoLegWalkFlat
  sim_backend: mujoco
  no_play: true
  export_onnx: false
  logger: tensorboard
  verbose_metrics: true
  log_root: logs/myoleg_flashsac_2048_analysis_gpu1

algo:
  num_envs: 2048
  batch_size: 4096
  replay_buffer_n: 512
  learning_starts: 98
  max_iterations: 5000
  save_interval: 500
  updates_per_step: 2
  policy_frequency: 2
  tau: 0.01
  actor_hidden_dim: 128
  critic_hidden_dim: 256
  obs_normalization: false
  use_layer_norm: false
  algo_params:
    normalize_reward: true
    use_compile: true
    actor_num_blocks: 2
    critic_num_blocks: 2
    temp_initial_value: 0.01
    temp_target_sigma: 0.15

reward:
  scales:
    vel_reward: 5.0
    done: -100.0
    cyclic_hip: -10.0
    ref_rot: 10.0
    joint_angle_rew: 5.0
    action_l2: 0.0
    action_rate: 0.0

env:
  scene:
    model_file: src/unilab/assets/robots/myoleg/leg/myolegs.xml
  max_episode_seconds: 10.0
  sim_dt: 0.001
  ctrl_dt: 0.01
  post_step_forward_sensor: true
  min_height: 0.8
  max_rot: 0.8
  hip_period: 100
  reset_type: random
  target_x_vel: 0.0
  target_y_vel: 1.2
  target_rot: null
  normalize_act: true
  enable_diagnostics_log: true
  log_every_n_steps: 10
  init_keyframe_index: 2
  init_keyframe_name: init
  torso_body_name: torso
  pelvis_body_name: pelvis
  foot_body_names: [talus_l, talus_r]
  cyclic_hip_joint_names: [hip_flexion_l, hip_flexion_r]
  joint_angle_rew_joint_names:
    - hip_adduction_l
    - hip_adduction_r
    - hip_rotation_l
    - hip_rotation_r
